# Source pools for the synthetic data generator.
#
# SYNTHETIC ONLY. Nothing here is a real person, business, address or phone
# number. Names are common Indian given names and surnames used as a word
# list; pincodes are real sorting codes but the house numbers, societies and
# phone numbers are invented. Identifiers are masked by construction and never
# generated in full.
#
# `script` gives the native-script form where one is provided. Only names with
# a native form can be rendered in Indic script by the generator, which is
# realistic — plenty of real records are Latin-only — and keeps the data
# honest rather than machine-back-transliterated.
#
# `variants` are alternative LATIN spellings that real data actually contains.
# They are the noise the pipeline has to see through, so they are listed
# explicitly rather than generated by random character edits.

regions:
  gujarat:
    weight: 0.34
    script: gujarati
    cities: [ahmedabad, surat, vadodara, rajkot, gandhinagar, bhavnagar]
  maharashtra:
    weight: 0.22
    script: devanagari
    cities: [mumbai, pune, nagpur]
  north:
    weight: 0.24
    script: devanagari
    cities: [delhi, jaipur, lucknow, indore, gurugram]
  south:
    weight: 0.20
    script: tamil
    cities: [chennai, coimbatore, madurai, bengaluru, kochi]

