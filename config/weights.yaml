# Scoring weights, decision bands, blocking and conflict rules.
#
# This is the file a solutions engineer tunes per customer. Nothing here
# requires a code change.

# --------------------------------------------------------------------------- #
# Pairwise features
# --------------------------------------------------------------------------- #
# Each feature returns a value in [0,1] or None when it cannot be computed
# (a field is missing on either side). None features are DROPPED and the
# remaining weights renormalise, so a record with no phone is not punished
# for the absence — only for a disagreement.
#
# The name weights sum to 0.46, deliberately BELOW `auto_merge`. Two different
# people called Jayesh Patel exist in every Indian dataset, so a perfect name
# agreement must not be able to reach the merge threshold on its own: with the
# address, pincode and phone all disagreeing, such a pair scores 0.46 and is
# rejected. Identity has to be carried by something other than the name.
#
# The corollary, and a real limitation: when a pair has *nothing but* names —
# both records missing address and phone — the name weights renormalise to 1.0
# and an identical name does merge. On name-only data that is the only
# available answer, and the eval report measures it as its own slice.
features:
  name_string:
    weight: 0.16
    description: Token-set similarity on the normalized Latin name.
  name_phonetic:
    weight: 0.20
    description: Agreement of Indic phonetic keys, matched token to token.
  name_rarity:
    weight: 0.06
    description: >
      Penalises a name agreement carried only by a very common surname.
      1.0 when at least one matching token is distinctive, lower when the
      only shared token is Patel/Shah/Kumar-class.
  address_core:
    weight: 0.20
    description: Order-tolerant similarity of building and locality tokens.
  house_number:
    weight: 0.12
    description: >
      House / flat / plot number: 1.0 exact, 0.7 same number with a wing or
      block letter on one side only, 0.0 different. The most discriminating
      part of an address — two different flats in one society are two
      different households, and `address_core` cannot see the difference
      because it drops short and numeric tokens by design.
  pincode:
    weight: 0.12
    description: 1.0 exact, 0.5 same sorting district, 0.0 otherwise.
  landmark:
    weight: 0.05
    description: Landmark phrase agreement after abbreviation expansion.
  phone:
    weight: 0.09
    description: 1.0 when the normalized last-10 digits are equal, else 0.0.

# --------------------------------------------------------------------------- #
# Decision bands
# --------------------------------------------------------------------------- #
# >= auto_merge            -> same_as edge, decision "merge"
# review_low .. auto_merge -> review queue, decision "review"
# < review_low             -> dropped, decision "reject"
#
# Defaults are deliberately conservative: for a KYC-shaped use case a false
# merge costs far more than a missed one, and the borderline band is where the
# human reviewer earns their keep.
#
# These values are not guesses — they come from the threshold sweep in
# `make eval`, reproduced in docs/eval-report.md:
#
#   auto_merge   pairwise P    R        F1       B-cubed F1   entities
#   0.62         0.940         0.938    0.939    0.964        1399
#   0.68         0.979         0.936    0.957    0.973        1436
#   0.74         0.981         0.933    0.957    0.972        1444   <- chosen
#   0.78         0.981         0.933    0.957    0.972        1446
#   0.82         0.982         0.931    0.956    0.972        1455
#   0.84         0.982         0.919    0.950    0.966        1489
#   0.90         0.981         0.838    0.904    0.935        1676
#
# The shape of this curve changed completely once the transitivity check
# existed. Before it, precision climbed steadily with the threshold and 0.84
# was the joint optimum; the threshold was the only thing holding false
# merges back. Now the transitivity check does that work, precision is flat
# at ~0.98 everywhere from 0.68 up, and raising the threshold buys nothing
# but lost recall. 0.84 cost 2.4 points of recall for one thousandth of
# precision.
#
# 0.74 sits in the middle of a flat plateau (0.68-0.78 are within 0.001 of
# each other on F1), so the choice is robust rather than perched on a peak.
#
# review_low drops to 0.62 to keep the review band meaningful: between 0.62
# and 0.74 precision falls from 0.981 to 0.940, which is exactly the region
# where a human's judgement is worth more than a threshold.
thresholds:
  auto_merge: 0.74
  review_low: 0.62

# --------------------------------------------------------------------------- #
# Evidence gate
# --------------------------------------------------------------------------- #
# Weights alone cannot keep names from carrying a merge, because dropping
# missing features renormalises the ones that remain. A pair where only the
# name features could be computed scores purely on the name, so an identical
# common name reaches 1.00 — and at scale those pairs act as bridges that
# chain unrelated clusters into one blob through connected components.
#
# So auto-merge has an entry requirement as well as a threshold: enough of the
# total weight must actually be computable, and at least one feature outside
# the name family must support the pair. A pair that fails the gate is not
# rejected — it is held at "review", which is the honest answer when the only
# thing two records agree on is a name.
evidence_gate:
  enabled: true
  # Of the total feature weight, how much must be computable (not None).
  min_evidence_weight: 0.55
  # At least one non-name feature must reach this value.
  require_non_name_support: true
  non_name_support_min: 0.5
  # Features that settle identity on their own. An exact match on one of
  # these waives both checks above — a shared phone number IS the
  # distinguishing evidence the gate exists to demand.
  strong_identifiers: [phone]

# --------------------------------------------------------------------------- #
# Blocking
# --------------------------------------------------------------------------- #
# Candidate pairs are generated from these keys only. Without blocking, 5,000
# records is 12.5M pairs; with it, a few tens of thousands.
blocking:
  strategies:
    - name: phonetic_first_token
      description: First phonetic token of the name.
      enabled: true
    - name: phonetic_sorted
      description: All phonetic tokens, sorted and joined — order-insensitive.
      enabled: true
    - name: phonetic_token_any
      description: Any single phonetic token (catches dropped middle names).
      enabled: true
    - name: phonetic_initial_sorted
      description: >
        One token reduced to its initial, the rest kept whole. Reunites
        "G. Pillai" with "Ganesan Pillai", which share no full token and
        whose only common token (the surname) sits in an oversized block.
      enabled: true
    - name: pincode
      description: Exact pincode.
      enabled: true
    - name: phone_last10
      description: Normalized last 10 digits of the phone.
      enabled: true
    - name: locality_phonetic
      description: Phonetic key of the locality token.
      enabled: false
  # A block larger than this is skipped: "Patel in 380008" can be thousands of
  # records and the all-pairs cost inside one block is quadratic. Records in an
  # oversized block are still reachable through their more selective keys.
  max_block_size: 120
  # Hard cap on candidate pairs, so a pathological input cannot hang the demo.
  max_candidate_pairs: 400000

# --------------------------------------------------------------------------- #
# Conflict rules (cluster-level)
# --------------------------------------------------------------------------- #
# Connected components over-merge when a hub record bridges two real entities.
# After components are formed, a component is split when a member pair trips a
# conflict rule. Each rule names the evidence that must disagree.
conflicts:
  enabled: true
  rules:
    - name: different_pincode_and_phone
      description: Two different valid pincodes AND two different phones.
      requires: [pincode_differs, phone_differs]
    - name: different_phone_strong
      description: Both sides have a phone, they differ, and the address is weak.
      requires: [phone_differs, address_weak]
  # A pair must score at least this well to survive a tripped conflict rule.
  override_score: 0.92
  address_weak_below: 0.45

# --------------------------------------------------------------------------- #
# Transitivity
# --------------------------------------------------------------------------- #
# A pairwise score says nothing about transitivity: A~B and B~C can both pass
# while A~C was looked at and rejected. Agglomeration alone will still put all
# three in one cluster, and that was the entire residual false-positive class
# in the evaluation — every sampled false-positive *pair* carried the decision
# `review` or `reject`, yet the records shared a cluster through a chain of
# other edges.
#
# So a merge is refused when the cluster it would create would contain a
# member pair that was scored and fell below `review_low`.
#
# The veto fires ONLY on pairs that were actually scored. A pair blocking never
# proposed is unknown, not disagreement — treating absence as a veto would make
# blocking's recall ceiling silently cap precision too, and would punish large
# true clusters where not every internal pair happens to be a candidate.
transitivity:
  enabled: true
  # Cross-cluster pair checks are capped so a pathological merge cannot
  # dominate the run. Above this the check is skipped and logged rather than
  # allowed to go quadratic; clusters are small in practice (largest 19).
  max_pair_checks: 20000
  # A pair scoring at least this much merges anyway, recorded as an unresolved
  # conflict — the same escape hatch the other conflict rules use.
  override_score: 0.95
  # A scored pair below this vetoes a merge that would unite its two records.
  #
  # Deliberately its own number rather than `review_low`. They were the same
  # knob at first, and moving the review band from 0.70 to 0.62 silently
  # weakened the veto — pairs scoring 0.62-0.70 stopped objecting, precision
  # fell from 0.982 to 0.951 and F1 with it. Two unrelated jobs ("which pairs
  # does a human look at" and "which pairs are confident enough to block a
  # merge") should not share a setting.
  #
  # Swept like everything else: 0.62 gives F1 0.944, 0.70 gives 0.957,
  # 0.74 gives 0.957. 0.70 is the knee.
  veto_below: 0.70

# --------------------------------------------------------------------------- #
# Baseline (for the comparison the stakeholder actually cares about)
# --------------------------------------------------------------------------- #
baseline:
  exact_threshold: 1.0
  # Jaro-Winkler on the RAW name string: no normalization, no phonetics.
  fuzzy_threshold: 0.88
  description: >
    What a team gets from a weekend of work: exact match, then Jaro-Winkler
    on raw name strings, blocked on the first two characters.

# --------------------------------------------------------------------------- #
# Canonical record selection
# --------------------------------------------------------------------------- #
canonical:
  # How the surviving name is chosen from a cluster.
  name_strategy: most_complete   # most_complete | most_frequent | longest
  # Prefer a Latin-script name for the canonical form; originals are kept as
  # provenance either way.
  prefer_latin: true

# --------------------------------------------------------------------------- #
# Review queue
# --------------------------------------------------------------------------- #
review:
  # Pairs shown per page in the web UI.
  page_size: 25
  # `uncertainty` puts the pairs closest to the decision boundary first, which
  # is where a reviewer's time is worth the most.
  order: uncertainty   # uncertainty | score_desc | score_asc
