# Honorifics, suffixes and name-level domain knowledge.
#
# Everything here is data, not code: add a term and re-run, no deploy.

# Stripped when they appear as a standalone token anywhere in the name.
honorifics:
  - shri
  - sri
  - shree
  - smt
  - smt.
  - srimati
  - shrimati
  - sou
  - kum
  - kumari
  - mr
  - mrs
  - ms
  - miss
  - dr
  - doctor
  - prof
  - professor
  - er
  - adv
  - advocate
  - ca
  - shrimant
  - thiru
  - thirumathi
  - selvi
  - janab
  - haji
  - sardar
  - sardarji
  - pandit
  - pt
  - swami
  - maulana
  - rev
  - late
  - m/s
  - messrs

# Stripped when they appear as a *trailing* fragment of a token.
# "Jayeshbhai" -> "Jayesh", "Kokilaben" -> "Kokila", "Rameshji" -> "Ramesh".
# Minimum stem length guards against destroying short real names.
affectionate_suffixes:
  # The "a"-prefixed forms absorb Indic internal schwa. સુરેશભાઈ is a
  # consonant-final stem (સુરેશ) plus ભાઈ, which transliterates to
  # "sureshabhai" — so "abhai" is the suffix to strip.
  #
  # There is deliberately no "aben": બેન attaches to female names that almost
  # always END in a long vowel (કોકિલા, ભાવના), so the 'a' in "kokilaben"
  # belongs to the stem. Stripping "aben" would turn Kokila into "kokil".
  - abhai
  - aji
  - bhai
  - bhaii
  - bai
  - ben
  - behn
  - bhen
  - ji
  - jee
  - kaka
  - kaki
  - mama
  - masi
  - anna
  - akka
  - amma
  - appa
  - da
  - didi
  - saheb
  - sahib
  - sab
  - singh_ji

# Guard: do not strip a suffix if the remaining stem would be shorter than this.
min_stem_length: 3

# Regexes removed from the raw name before tokenisation, for honorifics that
# contain punctuation and so cannot survive as a single token ("M/s Shah").
strip_patterns:
  - '\bm\s*/\s*s\b'
  - '\bmessrs\b'
  - '\bc\s*/\s*o\b'

# Tokens never stripped as a suffix even if they end with one of the above
# (real names that happen to end in a suffix-like string).
suffix_exceptions:
  - jiji
  - benji
  - raja
  - maja
  - banda
  - panda
  - nanda
  - gouda
  - gowda
  - handa
  - chanda
  - govinda
  - bhagwanda
  - sarada
  - veda
  - juneja
  - ahuja
  - bajaj

# Business **legal and structural** suffixes only. Captured into
# `legal_suffix` and removed from the matched name, because the legal wrapper
# is weak evidence of identity: "Patel Trading Pvt Ltd" and
# "M/s Patel Trading & Sons" should pair strongly on "Patel Trading".
#
# Trade and sector words are deliberately NOT in this list — see
# `business_sector_words` below for why.
business_suffixes:
  - pvt ltd
  - pvt. ltd.
  - private limited
  - pvt limited
  - public limited
  - ltd
  - limited
  - llp
  - llc
  - inc
  - incorporated
  - corp
  - corporation
  - company
  - co
  - "& co"
  - "and co"
  - "& sons"
  - "and sons"
  - "& brothers"
  - "and brothers"
  - bros
  - brothers
  - associates
  - group
  - "& associates"
  - "and associates"

# Sector words that stay IN the name, listed here only as documentation of a
# decision that is easy to get wrong.
#
# An earlier version stripped these as suffixes, which merged "Patel Trading"
# with "Patel Textiles" — two different businesses sharing a proprietor's
# surname — and reduced the canonical name of a resolved business to the bare
# word "Patel". The surname is the *least* identifying part of an Indian
# business name, because every firm in the market is named after a family.
# These words carry the signal; the legal wrapper above does not.
business_sector_words:
  - trading
  - traders
  - textiles
  - industries
  - industry
  - enterprise
  - enterprises
  - agency
  - agencies
  - stores
  - store
  - emporium
  - mart
  - supermart
  - kirana
  - mills
  - exports
  - imports
  - impex
  - sales
  - marketing
  - distributors
  - distributor
  - udyog
  - vyapar
  - bhandar
  - hardware
  - electricals
  - medical

# Surnames so common in India that name similarity alone is near-worthless
# evidence. The `name_rarity` feature downweights pairs whose only name
# agreement is one of these.
