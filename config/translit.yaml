# Rule-based Indic -> Latin transliteration tables.
#
# Deliberately NOT a trained model: deterministic, offline, inspectable, and
# good enough because the phonetic key downstream absorbs the residual
# disagreement (see PLAN.md assumption 3).
#
# Each script block has:
#   independent : standalone vowel letters
#   consonants  : consonant -> Latin base (WITHOUT the inherent vowel)
#   matras      : dependent vowel signs
#   virama      : character that suppresses the inherent vowel
#   signs       : anusvara / chandrabindu / visarga and friends
#   inherent    : the vowel implied by a bare consonant
#   drop_final_inherent : Hindi-style schwa deletion (राम -> ram, not rama)

scripts:
  devanagari:
    range: ["ऀ", "ॿ"]
    inherent: "a"
    drop_final_inherent: true
    virama: "्"
    independent:
      "अ": "a"
      "आ": "a"
      "इ": "i"
      "ई": "i"
      "उ": "u"
