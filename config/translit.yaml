# Latin-script spellings that are themselves transliteration variants and get
# folded before phonetics. Keeps the phonetic rules from carrying every case.
#
# The `amadavad` / `mumbaii` style entries also absorb internal schwa: this
# transliterator deletes the word-final inherent vowel (Hindi/Gujarati schwa
# deletion) but not word-internal ones, so अमदावाद comes out "amadavad".
# The phonetic key is vowel-blind and does not care, but the Latin form and
# the address features do, so the variants are folded here by name.
latin_variants:
  amdavad: ahmedabad
  amadavad: ahmedabad
  ahamadabad: ahmedabad
  ahmdabad: ahmedabad
  ahemdabad: ahmedabad
  bombay: mumbai
  bangalore: bengaluru
  calcutta: kolkata
  madras: chennai
  poona: pune
  baroda: vadodara
  mysore: mysuru
  trivandrum: thiruvananthapuram
  cochin: kochi
  gurgaon: gurugram
  pondicherry: puducherry
